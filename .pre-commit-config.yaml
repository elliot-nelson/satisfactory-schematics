# Keeps our own standards honest. Installed by `schematic doctor` (pre-commit install).
# CSharpier for the C# extractor comes later.
#
# Ruff runs as a LOCAL hook via `uv run` so it uses the exact same ruff version + pyproject config
# as `./schematic check`/`./schematic fix`. Pinning a ruff-pre-commit `rev` would just be a second
# version to keep in sync, and it drifts (an old rev once flagged the long-removed ANN101 rule).
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint + autofix)
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=512"]
