# Theme: Blue Schematic
#
# The crisp technical-drawing look: architect-blue line art with thinner strokes and NO
# jitter, so every edge is clean and straight like an engineering schematic. Ports +
# clearance ticks are on. `schematic build --theme blue-schematic` reads this file and writes into
# build/04-svg/blue-schematic/ (and dist/blue-schematic/); the slug is this file's stem.
# The theme-independent intermediates (rasters, strokes, manifests under build/03-render) are
# shared, so switching themes only repeats the cheap finalize pass.
#
# The hand-drawn sibling is themes/blue-excalidraw.yaml (same colors, with jitter); the
# annotation-free siblings are the *-clean.yaml themes (ports + ticks off).
theme:
  name: Blue Schematic

  # Line art + silhouette fill (the architect-blueprint body).
  lineColor: "#1a478c"          # feature-edge line color
  fillColor: "#1a478c"          # flat semi-transparent silhouette fill
  fillAlpha: 0.30               # silhouette fill opacity (0..1)
  lineWidth: 1.1                # thinner than excalidraw's 1.5 for a crisp technical line
  jitter: 0.0                   # no wobble -- clean, straight schematic edges

  # I/O port markers (red input / green output squares + circles). Set highlightPorts:
  # false to omit them entirely.
  highlightPorts: true
  inputPortColor: "#c82828"
  outputPortColor: "#28aa46"

  # Clearance / collision-box footprint corner ticks. Set showCollisionBoxTicks: false to
  # omit them.
  showCollisionBoxTicks: true
  collisionBoxColor: "#fa9549"
  collisionBoxAlpha: 0.70        # tick opacity (0..1)
