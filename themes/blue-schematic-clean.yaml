# Theme: Blue Schematic (Clean)
#
# blue-schematic with every annotation layer OFF: no I/O port markers, no clearance ticks --
# just the crisp thin line art + silhouette fill. For when you want the pure drawing.
# `schematic build --theme blue-schematic-clean` writes into build/04-svg/blue-schematic-clean/
# (and dist/blue-schematic-clean/); the slug is this file's stem.
theme:
  name: Blue Schematic (Clean)

  # Line art + silhouette fill (the architect-blueprint body).
  lineColor: "#1a478c"          # feature-edge line color
  fillColor: "#1a478c"          # flat semi-transparent silhouette fill
  fillAlpha: 0.30               # silhouette fill opacity (0..1)
  lineWidth: 1.1                # thinner than excalidraw's 1.5 for a crisp technical line
  jitter: 0.0                   # no wobble -- clean, straight schematic edges

  # Annotations off: no port markers, no clearance ticks.
  highlightPorts: false
  inputPortColor: "#c82828"
  outputPortColor: "#28aa46"
  showCollisionBoxTicks: false
  collisionBoxColor: "#fa9549"
  collisionBoxAlpha: 0.70        # tick opacity (0..1)
