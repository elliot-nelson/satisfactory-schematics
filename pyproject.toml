[project]
name = "satisfactory-schematics"
version = "0.1.0"
description = "Pre-rendered images of Satisfactory buildings, for use in your favorite diagramming tools."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Elliot Nelson" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
]

[project.scripts]
sat = "src.main:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.2",
    "pre-commit>=3.7",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["vendor", "build", "dist"]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle + pyflakes
    "I",            # isort
    "UP",           # pyupgrade
    "B",            # bugbear
    "SIM",          # simplify
    "C4",           # comprehensions
    "PTH",          # prefer pathlib
    "RUF",          # ruff-native
    "ANN",          # require type annotations
    "TID",          # tidy imports
]

[tool.ruff.lint.flake8-bugbear]
# Typer's declarative API puts Option/Argument calls in parameter defaults (B008).
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"src/render/blender/*" = ["ANN", "F821"]  # bpy is injected at runtime
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["build", "dist", "vendor"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
