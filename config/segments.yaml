# Tileable / architectural pieces (belt/pipe spline tiles, pipe junctions, steel beams).
#
# Extracted like buildings, but these have no clearance/ports of their own. Rendered as tiled runs /
# bent corners / as-is; `kind` drives how each renders later, and extraction just needs the mesh +
# name (the map key). They land in build/01-extract/models/segments/, so the building loop skips
# right over them.

segments:
  belt_segment:
    mesh: FactoryGame/Content/FactoryGame/Buildable/Factory/ConveyorBeltMk1/Mesh/SM_ConveyorBelt_Mk1
    kind: belt # spline tile -> straight runs + 90-deg corners
  pipe_segment:
    mesh: FactoryGame/Content/FactoryGame/Buildable/Factory/Pipeline/Mesh/Pipeline
    kind: pipe # spline tile -> straight runs + 90-deg corners
  pipe_junction_cross:
    mesh: FactoryGame/Content/FactoryGame/Buildable/Factory/PipeJunction/Mesh/SM_Pipe_Junction_Cross_01
    kind: junction # rendered as-is
  pipe_junction_t:
    mesh: FactoryGame/Content/FactoryGame/Buildable/Factory/PipeJunction/Mesh/SM_PipeJunction_T_01
    kind: junction # rendered as-is
  painted_beam:
    mesh: FactoryGame/Content/FactoryGame/Buildable/Building/Pillars/Mesh/SM_BeamPainted_01
    kind: beam # extrudes along local Z -> tiled to length
  cross_beam:
    mesh: FactoryGame/Content/FactoryGame/Buildable/Building/Pillars/Mesh/SM_Beam_01
    kind: beam # extrudes along local Z -> tiled to length
  beam_connector:
    mesh: FactoryGame/Content/FactoryGame/Buildable/Building/Pillars/Mesh/SM_ConnectionCube_01
    kind: connector-cube # rendered as-is
