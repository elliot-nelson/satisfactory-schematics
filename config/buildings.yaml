# The list of buildings we extract + render -- the one place to add/tweak one.
#
# Each entry:
#   mesh:      in-pak path to the visual body mesh (no extension; the extractor handles the
#              SM_/SK_ prefix and .uasset). The map KEY is the friendly name used everywhere
#              downstream (.glb name, clearance/ports keys, manifest).
#   blueprint: the Build_* package -- where the I/O ports + component transforms come from
#              (via `--dump-ports`). The Docs ClassName (Build_<X>_C) comes from the leaf.
#   category:  which preview section it lands in (production / logistics / architecture).
#   annot:     OPTIONAL per-building port-layer fixup. Only used later in the pipeline; extraction
#              doesn't care about it.
#
# Notes:
#   - We use the "_static" meshes where those are the current in-game geometry; a few buildings
#     want their SM_* mesh instead (splitter/merger squares, say).
#   - Checking paths for a new game version? Try:  ./schematic extract --find <substr>

constructor:
  mesh: FactoryGame/Content/FactoryGame/Buildable/Factory/ConstructorMk1/Mesh/ConstructorMk1_static
  blueprint: FactoryGame/Content/FactoryGame/Buildable/Factory/ConstructorMk1/Build_ConstructorMk1
  category: production

assembler:
  mesh: FactoryGame/Content/FactoryGame/Buildable/Factory/AssemblerMk1/Mesh/AssemblerMk1_static
  blueprint: FactoryGame/Content/FactoryGame/Buildable/Factory/AssemblerMk1/Build_AssemblerMk1
  category: production

manufacturer:
  mesh: FactoryGame/Content/FactoryGame/Buildable/Factory/ManufacturerMk1/Mesh/SM_Manufacturer
  blueprint: FactoryGame/Content/FactoryGame/Buildable/Factory/ManufacturerMk1/Build_ManufacturerMk1
  category: production

blender:
  mesh: FactoryGame/Content/FactoryGame/Buildable/Factory/Blender/Mesh/SM_Blender_01
  blueprint: FactoryGame/Content/FactoryGame/Buildable/Factory/Blender/Build_Blender
  category: production

smelter:
  mesh: FactoryGame/Content/FactoryGame/Buildable/Factory/SmelterMk1/Mesh/SmelterMk1_static
  blueprint: FactoryGame/Content/FactoryGame/Buildable/Factory/SmelterMk1/Build_SmelterMk1
  category: production

foundry:
  mesh: FactoryGame/Content/FactoryGame/Buildable/Factory/FoundryMk1/Mesh/FoundryMk1_static
  blueprint: FactoryGame/Content/FactoryGame/Buildable/Factory/FoundryMk1/Build_FoundryMk1
  category: production

refinery:
  mesh: FactoryGame/Content/FactoryGame/Buildable/Factory/OilRefinery/Mesh/SM_OilRefinery_01
  blueprint: FactoryGame/Content/FactoryGame/Buildable/Factory/OilRefinery/Build_OilRefinery
  category: production

particle_accelerator:
  mesh: FactoryGame/Content/FactoryGame/Buildable/Factory/HadronCollider/Mesh/SM_HadronCollider_01
  blueprint: FactoryGame/Content/FactoryGame/Buildable/Factory/HadronCollider/Build_HadronCollider
  category: production
  annot: { rot_deg: 180, shift: [9.5, 0, 0] } # port frame comes in flipped + offset; rigidly reseat it

packager:
  mesh: FactoryGame/Content/FactoryGame/Buildable/Factory/Packager/Mesh/SM_Packager_01
  blueprint: FactoryGame/Content/FactoryGame/Buildable/Factory/Packager/Build_Packager
  category: production

converter:
  mesh: FactoryGame/Content/FactoryGame/Buildable/Factory/Converter/Mesh/SM_Converter_01
  blueprint: FactoryGame/Content/FactoryGame/Buildable/Factory/Converter/Build_Converter
  category: production

# Logistics: use the square SM_ bodies, NOT the stretched-out *_static meshes.
splitter:
  mesh: FactoryGame/Content/FactoryGame/Buildable/Factory/CA_Splitter/Mesh/SM_Splitter_01
  blueprint: FactoryGame/Content/FactoryGame/Buildable/Factory/CA_Splitter/Build_ConveyorAttachmentSplitter
  category: logistics

merger:
  mesh: FactoryGame/Content/FactoryGame/Buildable/Factory/CA_Merger/Mesh/SM_Merger_01
  blueprint: FactoryGame/Content/FactoryGame/Buildable/Factory/CA_Merger/Build_ConveyorAttachmentMerger
  category: logistics
