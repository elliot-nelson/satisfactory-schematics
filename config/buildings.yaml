# Single source of truth for the buildings we extract + render.
#
# Each entry:
#   mesh:      in-pak asset path of the visual body mesh (no extension; SM_/SK_ prefix and a
#              trailing .uasset are handled by the extractor). The map KEY is the friendly
#              stem used everywhere downstream (.glb name, clearance/ports keys, manifest).
#   blueprint: the Build_* blueprint package -- source of I/O ports + component transforms
#              (via `--dump-ports`). The Docs ClassName (Build_<X>_C) is derived from the leaf.
#   category:  preview grouping (production / logistics / architecture).
#   annot:     OPTIONAL per-building port-layer correction (see SPEC.md 12.15). Consumed in a
#              later phase; harmless to extraction.
#
# Notes:
#   - We use the "_static" visual meshes where they're the current in-game geometry; some
#     buildings' SM_* meshes are the right body instead (e.g. splitter/merger squares, SPEC 12.7).
#   - Confirm paths for a new game version with:  ./schematic extract --find <substr>

constructor:
  mesh: FactoryGame/Content/FactoryGame/Buildable/Factory/ConstructorMk1/Mesh/ConstructorMk1_static
  blueprint: FactoryGame/Content/FactoryGame/Buildable/Factory/ConstructorMk1/Build_ConstructorMk1
  category: production

assembler:
